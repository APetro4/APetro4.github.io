<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#102a43">
	<link href="javajam.css" rel="stylesheet">
	<title>Under Maintenance</title>
	<style>
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 1.5rem;
			color: #243b53;
			background: linear-gradient(135deg, #f0f7ff, #d9eaf7);
			font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
		}
		main {
			width: min(100%, 560px);
			padding: clamp(2rem, 8vw, 4rem);
			text-align: center;
			background: #fff;
			border-radius: 1.25rem;
			box-shadow: 0 1rem 3rem rgb(16 42 67 / 12%);
		}
		.icon { font-size: 3rem; line-height: 1; }
		h1 { margin: 1rem 0 .75rem; color: #102a43; font-size: clamp(2rem, 7vw, 3rem); }
		p { margin: 0; color: #486581; }
		.status {
			display: inline-block;
			margin-top: 1.5rem;
			padding: .4rem .8rem;
			color: #155e63;
			background: #d9f3ee;
			border-radius: 999px;
			font-size: .9rem;
			font-weight: 600;
		}
	</style>
</head>
<body>
	<main>
		<div class="icon" aria-hidden="true">🛠️</div>
		<h1>We’ll be back soon</h1>
		<p>Our website is currently undergoing scheduled maintenance. We’re working to improve your experience and appreciate your patience.</p>
		<div class="status">Website maintenance in progress</div>
	</main>
</body>
</html>
